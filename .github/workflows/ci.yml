name: ci-test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: Fateme025
          POSTGRES_DB: simple_bank
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Install golang-migrate
        run: |
         curl -L https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz | tar xvz
         sudo mv migrate /usr/local/bin/
         which migrate
    
      - name: run migration
        run: make migrateup

      - name: Test
        run: make test
        env:
          DB_DRIVER: postgres
          DB_SOURCE: postgres://root:Fateme025@localhost:5432/simple_bank?sslmode=disable
          SERVICE_ADDRESS: 0.0.0.0:8080
          TOKEN_SYMMETRIC_KEY: "12345678901234567890123456789012"
          ACCESS_TOKEN_DURATION: 15m
          REFRESH_TOKEN_DURATION: 24h
